<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- TEMP diagnostic: turn a white-screen (uncaught error) into readable text
         on the device. Safe no-op when the app renders normally. Remove later. -->
    <script>
      (function () {
        function show(title, detail) {
          var el = document.getElementById('root') || document.body;
          el.innerHTML =
            '<div style="font:14px/1.5 system-ui,-apple-system,sans-serif;color:#0f172a;background:#fff;padding:20px;min-height:100vh;box-sizing:border-box">' +
            '<div style="font-weight:700;font-size:16px;color:#dc2626;margin-bottom:6px">Meridian — startup error</div>' +
            '<div style="color:#475569;margin-bottom:12px">Screenshot this and send it back.</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px">' +
            String(title).replace(/[<>&]/g, '') + '\n\n' + String(detail || '').replace(/[<>&]/g, '') +
            '</pre></div>';
        }
        window.addEventListener(
          'error',
          function (e) {
            // Ignore resource (img/css/font) load errors — only surface JS errors.
            if (e.target && e.target !== window && e.target.tagName && e.target.tagName !== 'SCRIPT') return;
            var src = e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : '';
            show((e.message || 'Error') + (src ? '\n' + src : ''), e.error && e.error.stack);
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason || {};
          show('Unhandled rejection: ' + (r.message || String(r)), r.stack);
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/meridian.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF7" />
    <title>Meridian — School Operating System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
