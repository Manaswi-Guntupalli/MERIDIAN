org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows: the Pub cache (C:) and this project (D:) live on different drives,
# which crashes Kotlin incremental compilation ("different roots"). Turning it
# off makes plugin Kotlin sources (camera, mobile_scanner, secure_storage)
# build cleanly. Full (non-incremental) compiles are unaffected in correctness.
kotlin.incremental=false
